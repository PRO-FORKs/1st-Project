name: Build Ren'Py Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RENPY_VERSION: "8.5.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Ren'Py
        run: |
          wget "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf "renpy-${RENPY_VERSION}-sdk.tar.bz2"

      - name: Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cd "$GITHUB_WORKSPACE/renpy-${RENPY_VERSION}-sdk"

          ./renpy.sh launcher distribute "$GITHUB_WORKSPACE" \
            --destination "$GITHUB_WORKSPACE/dist" \
            --package pc \
            --package mac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "$GITHUB_WORKSPACE"/dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"