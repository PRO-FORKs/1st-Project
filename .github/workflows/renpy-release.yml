name: Build Ren'Py Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Ren'Py
        run: |
          wget https://www.renpy.org/dl/8.5.4/renpy-8.5.4-sdk.tar.bz2
          tar -xjf renpy-8.5.4-sdk.tar.bz2

      - name: Build
        run: |
          mkdir -p dist

          ./renpy-8.5.4-sdk/renpy.sh launcher distribute "$GITHUB_WORKSPACE" \
            --destination "$GITHUB_WORKSPACE/dist" \
            --package pc \
            --package mac

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"